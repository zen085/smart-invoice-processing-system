{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h3 class="mb-4">
                    Create Account
                </h3>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-dark"
                    >
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
