{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Invoice System
    </title>

    <!-- BOOTSTRAP -->
    <link
        rel="stylesheet"
        href="{% static 'bootstrap/css/bootstrap.min.css' %}"
    >

    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CUSTOM STYLES -->
    <style>

        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #111827;
            --muted-text: #6b7280;
            --border-color: #e5e7eb;
            --primary-color: #111827;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-top: 14px;
            padding-bottom: 14px;
        }

        .navbar-brand {
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }

        .nav-btn {
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            transform: translateY(-1px);
        }

        /* MAIN CONTENT */
        .main-wrapper {
            padding-top: 50px;
            padding-bottom: 50px;
        }

        /* CARDS */
        .card {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow:
                0 10px 25px rgba(0,0,0,0.04),
                0 2px 6px rgba(0,0,0,0.02);
        }

        .card-body {
            padding: 2rem;
        }

        /* BUTTONS */
        .btn {
            border-radius: 12px;
            font-weight: 500;
            padding: 10px 18px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-dark {
            background: #111827;
            border-color: #111827;
        }

        /* INPUTS */
        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #fff;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #111827;
            box-shadow: 0 0 0 4px rgba(17,24,39,0.08);
        }

        /* TABLE */
        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: #111827;
            color: white;
        }

        .table thead th {
            border: none;
            font-weight: 600;
            padding: 16px;
        }

        .table tbody td {
            padding: 18px 16px;
            vertical-align: middle;
            border-color: #f1f3f5;
        }

        /* ALERTS */
        .alert {
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 20px;
        }

        /* BADGES */
        .badge {
            border-radius: 999px;
            font-weight: 500;
            padding: 8px 14px;
        }

        /* PAGE TITLE */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .page-subtitle {
            color: var(--muted-text);
        }

        footer {
            color: var(--muted-text);
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <!-- LOGO -->
            <a
                href="{% url 'home' %}"
                class="navbar-brand fw-bold text-white"
            >
                Smart Invoice
            </a>

            <!-- RIGHT NAV -->
            <div class="d-flex align-items-center gap-2">

                {% if user.is_authenticated %}

                    <a
                        href="{% url 'upload-file' %}"
                        class="btn {% if request.resolver_match.url_name == 'upload-file' %}btn-light text-dark{% else %}btn-outline-light{% endif %} nav-btn"
                    >
                        Upload
                    </a>

                    <a
                        href="{% url 'upload-dashboard' %}"
                        class="btn {% if request.resolver_match.url_name == 'upload-dashboard' %}btn-light text-dark{% else %}btn-outline-light{% endif %} nav-btn"
                    >
                        Dashboard
                    </a>

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                        class="mb-0"
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger nav-btn"
                        >
                            Logout
                        </button>

                    </form>

                {% else %}

                    <a
                        href="{% url 'login' %}"
                        class="btn btn-light text-dark nav-btn"
                    >
                        Login
                    </a>

                    <a
                        href="{% url 'register' %}"
                        class="btn btn-outline-light nav-btn"
                    >
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">

        <div class="container">

            <!-- MESSAGES -->
            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-{{ message.tags }} shadow-sm">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <!-- PAGE CONTENT -->
            {% block content %}
            {% endblock %}

            <!-- FOOTER -->
            <footer>

                <small>
                    Smart Invoice System 
                </small>

            </footer>

        </div>

    </main>

    <!-- BOOTSTRAP JS -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- AUTO HIDE ALERTS -->
    <script>

        setTimeout(() => {

            document
                .querySelectorAll(".alert")
                .forEach(alert => {

                    alert.remove();

                });

        }, 5000);

    </script>

</body>

</html>
